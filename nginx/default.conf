# Beperkt hoe vaak een bezoeker een aanvraag kan versturen.
limit_req_zone $binary_remote_addr zone=aanvragen:1m rate=10r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    absolute_redirect off;

    # Keycloak-sessies passen niet in de standaardbuffers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # De hele map is gekoppeld, omdat een build de map build opnieuw aanmaakt.
    root /srv/documentatie/build;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # De knop Inloggen opent het inlogscherm. Daarna komt de gebruiker terug op de homepage.
    location ~ ^/inloggen/?$ {
        return 302 /oauth2/start?rd=%2F;
    }

    location = /api/toegang-aanvragen {
        limit_req zone=aanvragen burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://toegang-api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Keycloak staat onder hetzelfde domein als de site.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location = /oauth2/auth-admin {
        internal;
        proxy_pass http://oauth2-proxy:4180/oauth2/auth?allowed_groups=admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # De pagina zelf bevat geen gegevens, maar alleen admins mogen hem openen.
    location = /community/beheer/ {
        auth_request /oauth2/auth-admin;
        error_page 401 = @inloggen;
        error_page 403 = @geen_toegang;
        add_header Cache-Control "no-store";
        try_files /community/beheer/index.html =404;
    }

    location @inloggen {
        return 302 /inloggen/;
    }

    location @geen_toegang {
        return 302 /geen-toegang/;
    }

    # Nginx zet de rollen zelf in de kop, zodat een bezoeker die niet kan vervalsen.
    # De API controleert daarna of de rol admin erbij staat.
    location /api/beheer/ {
        auth_request /oauth2/auth;
        auth_request_set $groepen $upstream_http_x_auth_request_groups;
        add_header Cache-Control "no-store";
        # Ruimte voor de reden van weigering (maximaal 1000 tekens).
        client_max_body_size 8k;
        proxy_pass http://toegang-api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Auth-Groups $groepen;
    }

    # Besloten inhoud, alleen voor ingelogde gebruikers. Dit zit bewust niet in de Docusaurus-build,
    # want alles in die build is openbaar.
    location /community/ {
        auth_request /oauth2/auth;
        add_header Cache-Control "no-store";
        alias /srv/community/;
    }
}
